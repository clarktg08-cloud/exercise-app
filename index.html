<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Exercise Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1 id="header-title">Today</h1>
  <span id="header-date" class="header-date"></span>
</header>

<main id="view" class="view"></main>

<nav class="tabbar">
  <button class="tab active" data-tab="today">Today</button>
  <button class="tab" data-tab="history">History</button>
</nav>

<script type="module" src="js/app.js"></script>
<script>
  // Service worker only outside local dev, so development never fights stale caches.
  if ('serviceWorker' in navigator &&
      !['localhost', '127.0.0.1'].includes(location.hostname)) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
